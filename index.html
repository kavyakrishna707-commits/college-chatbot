<!DOCTYPE html>
<html>

<head>

    <title>Devagiri College Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f3ec;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #42281d;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        #chatbox {
            height: 400px;
            border: 1px solid #ccc;
            padding: 15px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .user {
            text-align: right;
            margin: 10px;
            padding: 10px;
            background-color: #e8d8ca;
            border-radius: 8px;
        }

        .bot {
            text-align: left;
            margin: 10px;
            padding: 10px;
            background-color: #eeeeee;
            border-radius: 8px;
        }

        .input-area {
            display: flex;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            background-color: #42281d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🎓 Devagiri College Chatbot</h1>

    <p class="subtitle">
        Ask questions about St. Joseph's College
    </p>


    <div id="chatbox">

        <div class="bot">
            <b>Chatbot:</b>
            Hello! Ask me anything about the college.
        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask your question..."
        >

        <button onclick="sendQuestion()">
            Send
        </button>

    </div>

</div>


<script>

async function sendQuestion() {

    const input = document.getElementById("question");

    const chatbox = document.getElementById("chatbox");

    const question = input.value.trim();


    if (question === "") {
        return;
    }


    chatbox.innerHTML += `
        <div class="user">
            <b>You:</b> ${question}
        </div>
    `;


    input.value = "";


    chatbox.innerHTML += `
        <div class="bot" id="loading">
            <b>Chatbot:</b> Thinking...
        </div>
    `;


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: question
            })

        });


        const data = await response.json();


        document.getElementById("loading").remove();


        chatbox.innerHTML += `
            <div class="bot">
                <b>Chatbot:</b> ${data.reply}
            </div>
        `;


    } catch (error) {

        document.getElementById("loading").remove();

        chatbox.innerHTML += `
            <div class="bot">
                <b>Chatbot:</b>
                Unable to connect to the server.
            </div>
        `;

        console.error(error);

    }


    chatbox.scrollTop = chatbox.scrollHeight;

}

</script>

</body>

</html>
